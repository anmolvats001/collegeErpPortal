services:
  mysql-cloudinary:
    image: mysql:8.0
    container_name: mysql-cloudinary
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clouddb
    ports:
      - "4410:3306"
    volumes:
      - mysql_cloudinary_data:/var/lib/mysql

volumes:
  mysql_cloudinary_data:
